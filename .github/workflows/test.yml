name: Documentation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check documentation
        run: |
          git show --format= --check HEAD
          python3 - <<'PY'
          import re
          import subprocess
          from pathlib import Path
          from urllib.parse import unquote, urlsplit

          files = subprocess.check_output(["git", "ls-files", "*.md"], text=True).splitlines()
          for name in files:
              text = Path(name).read_text(encoding="utf-8")
              assert text.endswith("\n"), f"Missing final newline: {name}"
              assert not re.search(r"[^\S\n]+$", text, re.M), f"Trailing whitespace: {name}"
              for target in re.findall(r"\[[^\]]*\]\(([^\s)]+)\)", text):
                  url = urlsplit(target)
                  if url.scheme or url.netloc or not url.path:
                      continue
                  path = Path(name).parent / unquote(url.path)
                  assert path.is_file(), f"Broken local link in {name}: {target}"
          print(f"Checked {len(files)} Markdown files and their local links.")
          PY
